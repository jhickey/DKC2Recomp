# User guide site (docs/guide/, configured by mkdocs.yml).
#
# Pull requests that touch the documentation get a strict build and a
# repository-wide Markdown link check. Deployment to GitHub Pages is manual
# (workflow_dispatch) until the hosting repository is confirmed; to publish
# on every push to main instead, add a `push: branches: [main]` trigger and
# enable Pages with "GitHub Actions" as the source in the repository settings.
name: docs

on:
  pull_request:
    paths:
      - "**/*.md"
      - "mkdocs.yml"
      - "docs/requirements.txt"
      - "scripts/check_markdown_links.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Markdown links
        run: python scripts/check_markdown_links.py
      - name: Install site toolchain
        run: python -m pip install -r docs/requirements.txt
      - name: Build site (strict)
        run: zensical build --strict
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'workflow_dispatch'
        with:
          path: site

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

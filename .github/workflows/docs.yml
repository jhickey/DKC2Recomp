# User guide site (docs/guide/, configured by mkdocs.yml).
#
# Pull requests that touch the documentation get a strict build and a
# repository-wide Markdown link check. Pushes to main (and manual runs)
# also deploy the site to GitHub Pages at https://jhickey.github.io/DKC2Recomp/.
# Pages must use "GitHub Actions" as its source in the repository settings.
# Deployment only runs in the jhickey fork, so other clones just build.
name: docs

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "mkdocs.yml"
      - "docs/requirements.txt"
      - "scripts/check_markdown_links.py"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "**/*.md"
      - "mkdocs.yml"
      - "docs/requirements.txt"
      - "scripts/check_markdown_links.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check Markdown links
        run: python scripts/check_markdown_links.py
      - name: Install site toolchain
        run: python -m pip install -r docs/requirements.txt
      - name: Build site (strict)
        run: zensical build --strict
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request' && github.repository == 'jhickey/DKC2Recomp'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.repository == 'jhickey/DKC2Recomp'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

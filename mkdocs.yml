# User guide site. Built with Zensical (reads this MkDocs-format config):
#   python3 -m pip install -r docs/requirements.txt
#   zensical build --strict      # output in site/
#   zensical serve               # local preview
# Only docs/guide/ is published; developer docs stay in the repository.
site_name: DKC2Recomp
site_description: User guide for the DKC2Recomp native port of Donkey Kong Country 2.
site_url: https://jhickey.github.io/DKC2Recomp/
repo_url: https://github.com/jhickey/DKC2Recomp
edit_uri: edit/main/docs/guide/
docs_dir: docs/guide
site_dir: site

theme:
  name: material
  features:
    - navigation.sections
    - navigation.footer
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting started:
      - Installing and running: installing.md
      - Controls: controls.md
      - Pause menu and settings: overlay-and-settings.md
  - Features:
      - Video: video.md
      - Two-player co-op: co-op.md
      - Donkey and Kiddy characters: characters.md
      - MSU-1 music: msu1-music.md
      - Save tools: save-tools.md
  - Help:
      - Troubleshooting: troubleshooting.md
      - Environment variables: advanced.md
